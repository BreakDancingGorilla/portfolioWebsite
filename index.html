<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Home Of The King</title>
  <link id="favicon" rel="icon" type="image/x-icon" href="./cat.jpg">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="./style.css" rel="stylesheet">
</head>
<body>

  <div id="overlay"></div>

  <div id="header" class="container-fluid d-flex flex-row justify-content-between align-items-center p-4">
    <div id="title">
      <h1>Home Of The King</h1>
      <p id="aka" class="rainbow-text-animated">AKA FoodStampChamp / Cam_girl_76</p>
    </div>
  </div>


  <!-- Container for the cards -->
  <div id="siteList" class="d-flex flex-wrap justify-content-center p-2">

    <!-- Card 1 -->
    <div class="gray card shadow-lg p-0 m-3 rounded border border-warning" style="width: 18rem;">
      <img src="./changeGame.png" class="card-img-top" alt="Dice Game">
      <div class="card-body">
        <h5 class="card-title">Change Game <img src="./money.gif" class="title-gif"></h5>
        <p class="card-text">Made in collaboration with Kayne West and proundly sponsored by Yeezy</p>
        <div class="playBox">
          <a href="https://breakdancinggorilla.github.io/changeGame/" 
   class="btn btn-primary" 
   target="_blank" 
   rel="noopener noreferrer">Play</a>
          <div class="supportDevices">
            <img class="neon-red-icon" src="./phone.svg" alt="phone">
            <img class="neon-green-icon" src="./pc.svg" alt="pc">
            <img class="neon-red-icon" src="./controller.svg" alt="controller">
          </div>
        </div>
      </div>
    </div>

    <!-- Card 2 -->
    <div class="gray card shadow-lg p-0 m-3 rounded border border-warning" style="width: 18rem;">
      <img src="./diceGameSnap.png" class="card-img-top" alt="Dice Game">
      <div class="card-body">
        <h5 class="card-title">Dice Game <img src="./output-onlinegiftools.gif" class="title-gif"></h5>
        <p class="card-text">Made in collaboration with Rick Ross</p>
        <div class="playBox">
          <a href="https://breakdancinggorilla.github.io/diceGame/" 
   class="btn btn-primary" 
   target="_blank" 
   rel="noopener noreferrer">Play</a>
          <div class="supportDevices">
            <img class="neon-red-icon" src="./phone.svg" alt="phone">
            <img class="neon-green-icon" src="./pc.svg" alt="pc">
            <img class="neon-red-icon" src="./controller.svg" alt="controller">
          </div>
        </div>
      </div>
    </div>

    <div class="gray card shadow-lg p-0 m-3 rounded border border-warning" style="width: 18rem;">
      <img src="./cat.jpg" class="card-img-top" alt="Dice Game">
      <div class="card-body">
        <h5 class="card-title">Zombie Game <img src="./output-onlinegiftools.gif" class="title-gif"></h5>
        <p class="card-text">Stolen from Terry Davis</p>
        <div class="playBox">
          <a href="https://breakdancinggorilla.github.io/zombies/" 
   class="btn btn-primary" 
   target="_blank" 
   rel="noopener noreferrer">Play</a>
          <div class="supportDevices">
            <img class="neon-red-icon" src="./phone.svg" alt="phone">
            <img class="neon-green-icon" src="./pc.svg" alt="pc">
            <img class="neon-red-icon" src="./controller.svg" alt="controller">
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="https://jquery.com"></script>
  <script src="./code.js"></script>
</body>
</html>
